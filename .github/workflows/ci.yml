name: Application CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py tests
      - run: docker build -t core-api:test .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: core-api:test
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name core-api-ci --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 core-api:test
          trap 'docker rm -f core-api-ci' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8080/healthz
